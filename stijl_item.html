<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" charset="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <title>Товар</title>
        <link rel="stylesheet" href="./css/stijl_styles.css">
    </head>
    <body>
        <!-- Шапка страницы -->
        <header class="header">
            <!-- Контейнер Логотип + Каталог -->
            <div class="header_logo_catalogue">
                <!-- Логотип -->
                <div class="header_logo">
                    <img class="header_logo_img" src="./img/stijl_logo.png" alt="stijl_logo">
                </div>
                <!-- Каталог -->
                <nav class="header_catalogue">
                    <a class="header_furniture font_b" href="#">мебель</a>
                    <a class="header_lights font_b" href="#">свет</a>
                    <a class="header_fabrics font_b" href="#">текстиль</a>
                </nav>
            </div>
            <!-- Контейнер иконок -->
            <div class="header_menu">
                <form action="#" method="get">
                    <button class="header_search_button" type="submit"></button>
                </form>
                <form action="stijl_cart.html" method="get">
                    <button class="header_cart_button" type="submit"></button>
                </form>
                <form action="#" method="get">
                    <button class="header_account_button" type="submit"></button>
                </form>
            </div>
        </header>
        <div class="item_page_screen">
            <div class="item_page_photo">
                <img class="item_page_img" src="./img/item_cards/skogen_chair_shadow_img.png" alt="skogen_chair_shadow">
            </div>
            <div class="item_page_contents">
                <h1 class="item_page_headline font_t1 null_margin">SKOGEN</h1>
                <p class="item_page_name clr_black font_b null_margin">Табурет</p>
                <p class="item_page_pricetag font_t1 null_margin">2499₽</p>
                <button class="item_page_button action_button null_margin">КУПИТЬ</button>
            </div>
            <div class="item_page_description">
                <p class="item_page_description_text clr_black font_b null_margin">Изящные линии, удобная посадка, светлое дерево — всё это про табурет SKOGEN.</p>
            </div>
        </div>
    </body>
</html>
